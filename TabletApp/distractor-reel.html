<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>Distractor Reel — Block A tablet stimulus</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #000; overflow: hidden;
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    touch-action: none; overscroll-behavior: none;
  }
  #stage { position: fixed; inset: 0; background: #000; }
  canvas { display: block; width: 100%; height: 100%; }

  #setup {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 28px; background: #111; color: #eee;
  }
  #setup h1 { font-size: 22px; font-weight: 600; margin: 0 0 4px; color: #fff; }
  #setup p.hint { font-size: 14px; color: #999; margin: 0; max-width: 480px; text-align: center; }
  .modebtn {
    font-size: 20px; padding: 22px 48px; border-radius: 12px; border: 2px solid #555;
    background: #222; color: #eee; min-width: 320px; cursor: pointer;
  }
  .modebtn.selected { border-color: #4da3ff; background: #1c2e40; color: #fff; }
  #startbtn {
    font-size: 24px; padding: 20px 64px; border-radius: 12px; border: none;
    background: #2e7d32; color: #fff; cursor: pointer; opacity: 0.4; pointer-events: none;
  }
  #startbtn.ready { opacity: 1; pointer-events: auto; }

  #hud {
    position: fixed; left: 10px; bottom: 8px; z-index: 5;
    color: rgba(255,255,255,0.35); font-size: 13px; font-variant-numeric: tabular-nums;
    pointer-events: none;
  }
  #resetzone {
    position: fixed; right: 0; bottom: 0; width: 64px; height: 64px; z-index: 6;
  }
</style>
</head>
<body oncontextmenu="return false">

<div id="setup">
  <h1>Distractor Reel — Tablet Stimulus (Block A)</h1>
  <p class="hint">Choose the condition's tablet content, then tap Start on the experimenter's
    spoken countdown ("3-2-1-play"). Tap-and-hold the bottom-right corner at any time to
    reset back to this screen for the next condition.</p>
  <div style="display:flex; gap:20px;">
    <button class="modebtn" id="btn-black" onclick="selectMode('black')">Distractors-absent<br><small>(static black screen)</small></button>
    <button class="modebtn" id="btn-reel" onclick="selectMode('reel')">Distractors-present<br><small>(fast-cut reel + bursts)</small></button>
  </div>
  <button id="startbtn" onclick="startPlayback()">START</button>
</div>

<div id="stage">
  <canvas id="c"></canvas>
</div>
<div id="hud"></div>
<div id="resetzone" onmousedown="armReset()" onmouseup="cancelReset()" onmouseleave="cancelReset()"
     ontouchstart="event.preventDefault(); armReset()" ontouchend="cancelReset()"
     ontouchcancel="cancelReset()"></div>

<script src="distractor_schedule.js"></script>
<script>
// ---- deterministic pure-time background (no RNG at runtime) ----
const CUT_LEN = 0.35; // seconds per hard cut
const HUES = [4, 24, 48, 96, 150, 200, 260, 300, 330];

function hash32(n) {
  // xorshift-style integer hash -> [0,1). Pure function of n, fully reproducible.
  n = (n ^ 61) ^ (n >>> 16);
  n = n + (n << 3);
  n = n ^ (n >>> 4);
  n = Math.imul(n, 0x27d4eb2d);
  n = n ^ (n >>> 15);
  return (n >>> 0) / 4294967296;
}

function hsl(h, s, l) { return `hsl(${h}, ${s}%, ${l}%)`; }

let mode = null;       // 'black' | 'reel'
let startTime = null;  // performance.now() at playback start
let resetTimer = null;

// ?embedded=1: hosted inside another page's own fullscreen (e.g. PilotTools' margin
// iframes) instead of standalone on a study tablet. A document can only have one
// fullscreen element at a time, so the embedding parent already owns it — this flag
// just skips this page's own (redundant, likely-rejected) fullscreen request.
// Standalone tablet usage (no query param) is completely unaffected.
const EMBEDDED = new URLSearchParams(location.search).get('embedded') === '1';

function selectMode(m) {
  mode = m;
  document.getElementById('btn-black').classList.toggle('selected', m === 'black');
  document.getElementById('btn-reel').classList.toggle('selected', m === 'reel');
  document.getElementById('startbtn').classList.add('ready');
}

// Keeps the screen from sleeping mid-condition (critical for the static-black
// condition: zero touch input and zero screen change for 3.5 min otherwise
// reads as idle to Android). Re-requested on visibility change since the OS
// silently drops the lock when the tab is backgrounded.
let wakeLock = null;
async function acquireWakeLock() {
  try {
    if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
  } catch (e) { /* not fatal -- best effort */ }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && startTime !== null) acquireWakeLock();
});

function selectModeFullscreen() {
  const el = document.documentElement;
  const req = el.requestFullscreen || el.webkitRequestFullscreen;
  if (req) { try { req.call(el); } catch (e) { /* best effort */ } }
}

function startPlayback() {
  if (!mode) return;
  document.getElementById('setup').style.display = 'none';
  if (!EMBEDDED) selectModeFullscreen();
  acquireWakeLock();
  startTime = performance.now();
  requestAnimationFrame(tick);
}

function armReset() {
  resetTimer = setTimeout(() => {
    mode = null;
    startTime = null;
    document.getElementById('setup').style.display = 'flex';
    document.getElementById('btn-black').classList.remove('selected');
    document.getElementById('btn-reel').classList.remove('selected');
    document.getElementById('startbtn').classList.remove('ready');
  }, 900); // press-and-hold ~0.9s to avoid accidental resets
}
function cancelReset() { if (resetTimer) { clearTimeout(resetTimer); resetTimer = null; } }

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
window.addEventListener('resize', resize);
resize();

function drawCutBackground(t, w, h) {
  const cutIndex = Math.floor(t / CUT_LEN);
  const r1 = hash32(cutIndex * 2 + 1);
  const r2 = hash32(cutIndex * 2 + 2);
  const hue = HUES[Math.floor(r1 * HUES.length)];
  ctx.fillStyle = hsl(hue, 85, 45 + Math.floor(r2 * 15));
  ctx.fillRect(0, 0, w, h);

  // Bold overlaid shape, changes every cut too.
  const shapeKind = Math.floor(hash32(cutIndex * 2 + 3) * 3);
  const accentHue = (hue + 150 + Math.floor(hash32(cutIndex * 2 + 4) * 60)) % 360;
  ctx.fillStyle = hsl(accentHue, 90, 60);
  const cx = w * (0.2 + 0.6 * hash32(cutIndex * 3 + 1));
  const cy = h * (0.2 + 0.6 * hash32(cutIndex * 3 + 2));
  const size = Math.min(w, h) * (0.25 + 0.35 * hash32(cutIndex * 3 + 3));
  if (shapeKind === 0) {
    ctx.beginPath(); ctx.arc(cx, cy, size / 2, 0, Math.PI * 2); ctx.fill();
  } else if (shapeKind === 1) {
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(hash32(cutIndex) * Math.PI);
    ctx.fillRect(-size / 2, -size / 4, size, size / 2); ctx.restore();
  } else {
    ctx.beginPath();
    ctx.moveTo(cx, cy - size / 2); ctx.lineTo(cx + size / 2, cy + size / 2);
    ctx.lineTo(cx - size / 2, cy + size / 2); ctx.closePath(); ctx.fill();
  }
}

function drawContinuousMovers(t, w, h) {
  // 3 shapes on continuous Lissajous-style paths -- pure functions of t, always moving.
  const movers = [
    { fx: 0.13, fy: 0.17, phx: 0.0, phy: 1.3, hue: 55,  r: 0.09 },
    { fx: 0.09, fy: 0.21, phx: 2.1, phy: 0.4, hue: 190, r: 0.07 },
    { fx: 0.19, fy: 0.11, phx: 4.2, phy: 3.0, hue: 320, r: 0.08 },
  ];
  for (const m of movers) {
    const x = w * (0.5 + 0.42 * Math.sin(2 * Math.PI * m.fx * t + m.phx));
    const y = h * (0.5 + 0.42 * Math.sin(2 * Math.PI * m.fy * t + m.phy));
    ctx.fillStyle = hsl(m.hue, 95, 65);
    ctx.beginPath(); ctx.arc(x, y, Math.min(w, h) * m.r, 0, Math.PI * 2); ctx.fill();
  }
}

function activeBurst(t) {
  if (!window.DISTRACTOR_SCHEDULE) return null;
  for (const b of DISTRACTOR_SCHEDULE.bursts) {
    if (t >= b.t && t <= b.t + b.duration_s) return { burst: b, u: (t - b.t) / b.duration_s };
  }
  return null;
}

function drawBurst(info, w, h) {
  const { burst, u } = info; // u in [0,1] across the burst
  // Two rapid flash pulses in the first half.
  const flashOn = (u < 0.22) || (u >= 0.34 && u < 0.5);
  if (flashOn) {
    ctx.fillStyle = hsl(burst.flash_hue, 100, 62);
    ctx.fillRect(0, 0, w, h);
  }
  // One large shape sweeping edge-to-edge over the whole burst duration.
  const size = Math.min(w, h) * 0.42;
  let x, y;
  if (burst.motion_dir === 'ltr')      { x = -size + u * (w + 2 * size); y = h * 0.5; }
  else if (burst.motion_dir === 'rtl') { x = w + size - u * (w + 2 * size); y = h * 0.5; }
  else if (burst.motion_dir === 'ttb') { x = w * 0.5; y = -size + u * (h + 2 * size); }
  else                                 { x = w * 0.5; y = h + size - u * (h + 2 * size); }
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(x, y, size / 2, 0, Math.PI * 2); ctx.fill();
}

function tick(now) {
  requestAnimationFrame(tick);
  if (startTime === null) return;
  const w = canvas.width, h = canvas.height;

  if (mode === 'black') {
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, w, h);
    document.getElementById('hud').textContent = '';
    return;
  }

  const duration = (window.DISTRACTOR_SCHEDULE && DISTRACTOR_SCHEDULE.duration_s) || 210;
  const t = ((now - startTime) / 1000) % duration; // loop if a condition overruns

  drawCutBackground(t, w, h);
  drawContinuousMovers(t, w, h);
  const burst = activeBurst(t);
  if (burst) drawBurst(burst, w, h);

  document.getElementById('hud').textContent = `REEL  t=${t.toFixed(1)}s`;
}
</script>
</body>
</html>
